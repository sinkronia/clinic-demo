name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    uses: Sinkronia/code-standards/.github/workflows/ci-dotnet.yml@v0.1.1
    with:
      solution: backend/Clinic.sln

  security:
    uses: Sinkronia/code-standards/.github/workflows/security.yml@v0.1.1

  rules:
    uses: Sinkronia/code-standards/.github/workflows/rules.yml@v0.1.1

  ai-review:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ai-review')
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: Sinkronia/code-standards/.github/workflows/ai-review.yml@v0.1.1
    secrets: inherit

  ci-ok:
    needs: [dotnet, security, rules]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          echo "dotnet=${{ needs.dotnet.result }} security=${{ needs.security.result }} rules=${{ needs.rules.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then exit 1; fi
